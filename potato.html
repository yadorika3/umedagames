<script>
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const idx=[];
for(let i=0;i<L-1;i++)for(let j=0;j<S;j++){const a=i*S+j,b=i*S+(j+1)%S,c=(i+1)*S+j,d=(i+1)*S+(j+1)%S;idx.push(a,b,c,b,d,c)}
const c0=L*S,c1=L*S+1,lo=(L-1)*S;
for(let j=0;j<S;j++){const n=(j+1)%S;idx.push(c0,n,j);idx.push(c1,lo+j,lo+n)}

// ---- フライ1本: 連続メッシュ。スパイン+フレーム+エッジループ ----
function makeFry(p){
  const r=rnd(p.seed),ph=[r()*6,r()*6,r()*6],pos=[],col=[],cA=r()<.5?(r()-.5)*.8:0,cB=r()<.5?(r()-.5)*.8:0;
  const P=t=>new THREE.Vector3(p.bend*Math.sin(Math.PI*t)*p.len+.02*Math.sin(t*5+ph[0])+p.flare*p.len*Math.pow(Math.max(0,t-.55)/.45,2),t*p.len,.5*p.bend*p.len*Math.sin(2*Math.PI*t+ph[1]));
  const X=new THREE.Vector3(1,0,0),e=1e-3;
  for(let i=0;i<L;i++){
    const u=i/(L-1),t=.5-.5*Math.cos(Math.PI*u);               // 端にループを密集
    const c=P(t),T=P(Math.min(1,t+e)).sub(P(Math.max(0,t-e))).normalize();
    const N=X.clone().addScaledVector(T,-X.dot(T)).normalize(),B=new THREE.Vector3().crossVectors(T,N);
    const k=(1-p.taper*Math.pow(Math.abs(2*t-1),3))*(1+.07*Math.sin(t*7+ph[2]))*(1+p.crink*Math.sin(t*p.cf));
    const tw=p.twist*t,ct=Math.cos(tw),st=Math.sin(tw),edge=Math.pow(Math.abs(2*t-1),10);
    for(let j=0;j<S;j++){
      const q=Math.PI/4+j/S*Math.PI*2,cs=Math.cos(q),sn=Math.sin(q),m=2/p.n,jt=1+.012*Math.sin(j*3.7+i*1.9+ph[1]*5)+.008*Math.sin(t*23+j+ph[2]);
      const x=jt*p.w*k*sg(cs)*Math.pow(Math.abs(cs),m),y=jt*p.h*k*sg(sn)*Math.pow(Math.abs(sn),m);
      const a=x*ct-y*st,b=x*st+y*ct;
      const sh=i==L-1?cA*a:i==0?cB*a:0;pos.push(c.x+N.x*a+B.x*b+T.x*sh,c.y+N.y*a+B.y*b+T.y*sh,c.z+N.z*a+B.z*b+T.z*sh);
      const cn=j%4==0?.93:1,pt=.5+.5*Math.sin(t*3+ph[0]),ao=p.noAO?1:.72+.28*Math.min(1,Math.max(0,(t-.3)/.4)),g=cn*ao*(.98+.02*Math.sin(t*13+ph[0]));

    }
  }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setIndex(new THREE.BufferAttribute(INDEX,1));
  g.computeVertexNormals();
  const n=g.attributes.normal.array,qn=new Int8Array(n.length);        // 最適化: 法線 Int8
  for(let i=0;i<n.length;i++)qn[i]=Math.round(n[i]*127);
  g.setAttribute('normal',new THREE.BufferAttribute(qn,3,true));
  g.setAttribute('color',new THREE.BufferAttribute(new Uint8Array(col.map(Math.round)),3,true)); // 色 Uint8
  g.computeBoundingSphere();return g;
}
// ---- バリエーション ----
const base={len:2.7,w:.072,h:.072,n:8,flare:.015,bend:0,twist:.3,crink:0,cf:0,taper:.05};
const VAR=[
 {name:'ストレート',w:.07,h:.07},{name:'ゆるカーブ',bend:.03,twist:.8},{name:'長',len:2.8,w:.064,h:.064},{name:'太め',w:.08,h:.08,len:2.6,n:7},
 {name:'細め',w:.055,h:.055,len:2.75,flare:.02},{name:'クリンクル',crink:.05,cf:28,n:6},{name:'反り',bend:-.025,n:5},{name:'短',len:2.45}
];
// ---- 箱: 折り紙のように1枚の連続メッシュ(頂点共有・フラット面) ----
function makeBox(){
  const bw=.76,bd=.4,tw=.9,td=.5,hb=2.35,hf=2.1,dip=.5,N=14,M=7;
  const fp=k=>{const x=tw*(1-k/M);return [x,hf-dip*(1-Math.pow(Math.abs(x/tw),3)),td+.05*(1-(x/tw)*(x/tw))]};
  const v=[[-bw,0,-bd],[bw,0,-bd],[bw,0,bd],[-bw,0,bd],[-tw,hb,-td],[tw,hb,-td],[tw,hf,td],[-tw,hf,td],
   [0,hb+.1,-td],[tw,2.18,0],fp(M),[-tw,2.18,0],[0,0,0]];
  const F=[6];for(let k=1;k<N;k++){if(k==M)F.push(10);else{F.push(v.length);v.push(fp(k))}}F.push(7);const Bm=v.length;v.push([0,0,bd+.03]);
  const rim=[4,8,5,9,...F,11],inn=rim.map(i=>{const p=v[i];const L=Math.hypot(p[0],p[2])||1;v.push([p[0]*(1-.05/L),p[1]-.05,p[2]*(1-.05/L)]);return v.length-1});
  const f=[];
  [[0,1,4,5,8],[1,2,5,6,9],[3,0,7,4,11]].forEach(([p,q,tp,tq,m])=>f.push(p,q,m,p,m,tp,q,tq,m));
  f.push(2,Bm,10,3,10,Bm);for(let k=0;k<M;k++)f.push(2,F[k],F[k+1],3,F[k+M],F[k+M+1]);
  for(let i=0;i<4;i++)if(i!=2)f.push(12,i,(i+1)%4);f.push(12,2,Bm,12,Bm,3);
  
  for(let i=0;i<f.length;i+=3){const A=v[f[i]],B=v[f[i+1]],C=v[f[i+2]],u=B.map((q,n)=>q-A[n]),w=C.map((q,n)=>q-A[n]);
    const nn=[u[1]*w[2]-u[2]*w[1],u[2]*w[0]-u[0]*w[2],u[0]*w[1]-u[1]*w[0]],dd=[0,1,2].map(n=>(A[n]+B[n]+C[n])/3-(n==1?1.1:0));
    if(nn[0]*dd[0]+nn[1]*dd[1]+nn[2]*dd[2]<0){const t=f[i+1];f[i+1]=f[i+2];f[i+2]=t}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v.flat()),3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(f),1));return g;
}

const $=i=>document.getElementById(i),V3=THREE.Vector3,W=()=>cv.clientWidth,H=()=>cv.clientHeight,fxc=$('fx'),fx2=fxc.getContext('2d'),PN1='プレイヤー1',PN2='プレイヤー2';
R.localClippingEnabled=true;

let AC;function beep(f,d=.12,t='square',v=.05,s=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+s;o.type=t;o.frequency.setValueAtTime(f,n);o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
const vib=p=>navigator.vibrate&&navigator.vibrate(p);
let P2=[],Tch=null;
function emit(x,y,n,o){for(let i=0;i<n&&P2.length<1600;i++){const a=(o.a0??0)+Math.random()*(o.a1??6.28),sp=(o.sp||2)*(.4+Math.random());P2.push({x:x+(Math.random()-.5)*(o.sx||0),y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+(o.vy||0),g:o.g||0,l:0,m:(o.life||40)*(.7+Math.random()*.6),s:(o.size||6)*(.6+Math.random()*.8),c:o.c||'#fff',ch:o.ch,sq:o.sq,grow:o.grow,bn:o.bn,rot:Math.random()*6,vr:(Math.random()-.5)*.3})}}
function rays(r){fx2.save();fx2.translate(r.x,r.y);fx2.rotate(r.t);fx2.fillStyle=r.c;fx2.globalAlpha=r.a;for(let i=0;i<14;i++){fx2.rotate(Math.PI*2/14);fx2.beginPath();fx2.moveTo(0,0);fx2.lineTo(1000,-70);fx2.lineTo(1000,70);fx2.fill()}fx2.restore()}
function drawTouch(){if(!Tch)return;const n=performance.now(),pts=Tch.pts.filter(q=>n-q[2]<450);if(!pts.length&&!Tch.down){Tch=null;return}
 fx2.save();fx2.lineCap='round';fx2.lineJoin='round';
 for(let i=1;i<pts.length;i++){const a=1-(n-pts[i][2])/450;fx2.strokeStyle=`rgba(255,${180+60*a|0},60,${a*.9})`;fx2.lineWidth=4+14*a;fx2.shadowColor='#ffb020';fx2.shadowBlur=14;fx2.beginPath();fx2.moveTo(pts[i-1][0],pts[i-1][1]);fx2.lineTo(pts[i][0],pts[i][1]);fx2.stroke()}
 if(Tch.down){const st=Pl&&Pl.mode=='drag'&&Pl.lag>.2,r=26+4*Math.sin(n/80);fx2.shadowBlur=20;fx2.shadowColor=st?'#f33':'#fff';fx2.strokeStyle=st?'#ff4d2e':'#fff';fx2.lineWidth=5;fx2.beginPath();fx2.arc(Tch.x,Tch.y,r,0,6.3);fx2.stroke();fx2.fillStyle=st?'rgba(255,77,46,.3)':'rgba(255,255,255,.3)';fx2.fill()}
 fx2.restore()}
function potOn(){if($('pot'))return;const d=document.createElement('div');d.id='pot';for(let i=0;i<12;i++){const r=document.createElement('div');r.textContent='POTATO '.repeat(30);d.appendChild(r)}$('wrap').insertBefore(d,$('wrap').firstChild)}
function potOff(){const d=$('pot');if(d)d.remove()}
function cracks(x,y){const L=[];for(let i=0;i<14;i++){let a=i*Math.PI*2/14+Math.random()*.4,px=x,py=y;const pts=[[x,y]],n=6+Math.floor(Math.random()*4);for(let k=0;k<n;k++){const d=60+Math.random()*110;a+=(Math.random()-.5)*.6;px+=Math.cos(a)*d;py+=Math.sin(a)*d;pts.push([px,py]);

// ===== プロモーション(確率固定)モード =====
// 引く順に結果の長さ(cm)を固定。どのポテトを選んでも、引いた順で台本どおりの長さになる。
// 1.3 と 0.9 はハズレ→画面が割れる→「もう一回」。直後の一回が112cm / 140cm のUR。
const SCRIPT=[8.4,1.3,112,15.6,6.2,0.9,140,46.0];
function fixFry(f){const L=G.script[G.si];if(L===undefined||f===G.rig)return;if(G.rig&&G.rig.alive)setLen(G.rig,G.rig.len0);if(f.len0===undefined)f.len0=f.len;setLen(f,L);G.rig=f}
function startFixed(){newGame();G.fixed=true;G.script=SCRIPT;G.si=0}
// ===== 入力 =====
const _v=new V3(),scr=p=>{_v.copy(p).project(cam);return[(_v.x*.5+.5)*W(),(-_v.y*.5+.5)*H()]},tp=(f,k)=>scr(f.mesh.localToWorld(new V3(0,f.Lg*k,0)));
const segD=(px,py,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/l));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)};
cv.addEventListener('pointerdown',e=>{Tch={x:e.clientX,y:e.clientY,pts:[[e.clientX,e.clientY,performance.now()]],down:true};emit(e.clientX,e.clientY,8,{c:'#fff',sp:3,size:3,life:20});if(Pl&&Pl.mode=='hold'){Pl.mode='drag';Pl.y0=e.clientY+Pl.p*H()*.5;Pl.x0=e.clientX;Pl.t=Pl.p;return}if(G.phase!='player'||G.busy||Pl)return;let best=null,bd=44;
 pool.forEach(f=>{if(!f.alive)return;const p=[1.8,2.3,2.8,f.tipY].map(y=>scr(f.mesh.localToWorld(new V3(0,y-f.by,0))));for(let i=0;i<3;i++){const dd=segD(e.clientX,e.clientY,p[i],p[i+1]);if(dd<bd){bd=dd;best=f}}});
 if(best){Pl={f:best,mode:'drag',p:0,s:0,ts:0,ck:0,pk:0,lag:0,y0:e.clientY,x0:e.clientX,dec:false,tick:0,who:G.who};G.cur=best;if(G.fixed)fixFry(best);else if(G.bonus)rigFry(best)}else Sg={x0:e.clientX,lx:e.clientX,dir:0,run:0,off:0}});
addEventListener('pointermove',e=>{
 if(Tch&&Tch.down){Tch.x=e.clientX;Tch.y=e.clientY;Tch.pts.push([e.clientX,e.clientY,performance.now()]);if(Tch.pts.length>40)Tch.pts.shift()}
 if(Pl&&Pl.mode=='drag'){const dx=e.clientX-Pl.x0,dy=Pl.y0-e.clientY;
  if(!Pl.dec){if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)){Sg={x0:Pl.x0,lx:e.clientX,dir:0,run:0,off:0};Pl=null;G.cur=null}else if(dy>10){Pl.dec=true;$('hint').style.opacity=0;beep(300,.05)}else return}
  if(Pl){Pl.ts=Math.max(0,dy*.02+dy*dy*.00006);return}}
 if(Sg){const dx=e.clientX-Sg.lx;if(Math.abs(dx)>3){const d=Math.sign(dx);if(Sg.dir&&d!=Sg.dir&&Sg.run>=50){shake();Sg.run=0}Sg.dir=d;Sg.run+=Math.abs(dx);Sg.lx=e.clientX;Sg.off=Math.max(-.35,Math.min(.35,(e.clientX-Sg.x0)*.004))}}});
const rel=()=>{if(Tch)Tch.down=false;if(Pl&&Pl.mode=='drag'){if(!Pl.dec){upd(Pl.f,0);Pl=null;G.cur=null}else if(!Pl.cm){Pl.mode='back';G.busy=true}else{Pl.mode='auto';Pl.sp=2.5;G.busy=true}}if(Sg){if(Sg.run>=50)shake();Sg=null}};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
function size(){R.setSize(W(),H(),false);fxc.width=W();fxc.height=H();cam.far=600;cam.aspect=W()/H();cam.updateProjectionMatrix()}
addEventListener('resize',size);size();camZ=baseZ();buildScene();
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1e3);last=t;const T=t/1e3;
 pool.forEach(f=>{if(f.tw&&f.alive){const w=f.tw;w.t=Math.min(1,w.t+dt/.6);const e=w.t<.5?2*w.t*w.t:1-Math.pow(-2*w.t+2,2)/2;for(const k in w.b)f[k]=w.a[k]+(w.b[k]-w.a[k])*e;if(!(Pl&&Pl.f===f)){upd(f,0);f.mesh.position.y+=Math.sin(w.t*Math.PI)*.35}if(w.t>=1)f.tw=null}});
 if(Sg){grp.position.x+=(Sg.off-grp.position.x)*.4;grp.rotation.z=-Sg.off*.15}else if(!(G.shk>0)){grp.position.x*=.7;grp.rotation.z*=.7}
 if(G.shk>0){G.shk-=dt;const k=Math.max(0,G.shk/.6);grp.position.x=Math.sin(T*70)*.12*k;grp.rotation.z=Math.sin(T*55)*.03*k;if(G.shk<=0){grp.position.x=0;grp.rotation.z=0}}
 if(Pl){const f=Pl.f;if(Pl.mode=='auto')Pl.p=Math.min(1,Pl.p+dt*(Pl.sp||2.2));else if(Pl.mode=='back'){Pl.s=Math.max(0,Pl.s-dt*8);Pl.p=Pl.s/f.D}else if(Pl.mode=='drag'){const lag=Pl.ts-Pl.s,vmax=4/(1+Math.min(f.len,30)*.03)*(1+Math.max(0,Pl.s-6)*.35)*((Pl.s>1&&Pl.s<1.4)?.35:1);Pl.s=Math.max(0,Pl.s+Math.max(-8*dt,Math.min(vmax*dt,lag)));Pl.p=Math.min(1,Pl.s/f.D);Pl.lag=lag;if(f.by+Pl.p*f.D>2.3)Pl.cm=true;
   const tk=Math.floor(Pl.s*2);if(tk!=Pl.tick){Pl.tick=tk;beep(220+Math.min(1,Pl.s/6)*700,.03,'square',.03);vib(8);const[x,y]=scr(grp.localToWorld(new V3(0,2.1,0)));emit(x,y,3,{c:'#e8c070',sp:2,size:3,life:20,sx:40})}
   if(lag>.2&&T-Pl.ck>.14){Pl.ck=T;beep(80+Math.random()*60,.09,'sawtooth',.05);vib(14)}
   
   if(Pl.p>=1){Pl.mode='auto';Pl.sp=2.5;G.busy=true}}
  upd(f,Pl.p);if(Pl.mode=='drag'&&Pl.lag>.2)f.mesh.position.x+=Math.sin(T*50)*.05*Math.min(1,Pl.lag);if(Pl.wob)f.mesh.position.x+=Math.sin(T*40)*.1*Pl.p*(1-Pl.p);
  if(Pl.mode=='auto'&&Pl.p>=1){const q=Pl;Pl=null;gacha(q.f,q.who)}else if(Pl&&Pl.mode=='back'&&Pl.p<=0){G.busy=false;G.cur=null;Pl=null;$('hint').style.opacity=1}}
 pool.forEach(f=>{if(!f.alive)return;const sel=(Pl&&Pl.f===f)||G.cpuLook===f;
  if(f.glow)f.mat.emissive.copy(f.glow).multiplyScalar(.4+.3*Math.sin(T*10));else (v=>f.mat.emissive.setRGB(v,v,v))(sel?.25+.2*Math.sin(T*12):0);
  if(f.syT!==undefined)f.mesh.scale.y+=(f.syT-f.mesh.scale.y)*Math.min(1,dt*6)});
 if(G.phase=='gacha'&&G.cur){const f=G.cur;f.mesh.rotation.y=(f.spin+=dt*2.5);const[x,y]=tp(f,.4);if(G.rays){G.rays.x=x;G.rays.y=y;G.rays.t+=dt*.8;if(G.drum)G.rays.c=`hsl(${(T*500)%360},90%,60%)`;else if(G.rainbow)G.rays.c=`hsl(${(T*300)%360},90%,60%)`}}
 for(let i=flights.length-1;i>=0;i--){const q=flights[i];q.t+=dt/.7;const k=Math.min(1,q.t);q.m.position.lerpVectors(q.from,q.to,k*k);q.m.position.y+=Math.sin(k*Math.PI)*1.2;q.m.rotation.z+=.25;q.m.scale.setScalar(1-.6*k);if(k>=1){grp.remove(q.m);q.m.geometry.dispose();q.m.material.dispose();flights.splice(i,1)}}
 for(let i=debris.length-1;i>=0;i--){const q=debris[i];q.t+=dt;q.v.y-=14*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotation.x+=q.w.x*dt;q.m.rotation.y+=q.w.y*dt;if(q.t>4){sc.remove(q.m);debris.splice(i,1)}}
 for(const q of spill){if(!q.rest){q.v.y-=16*dt;q.m.position.addScaledVector(q.v,dt);q.m.rotateX(q.w.x*dt);q.m.rotateZ(q.w.z*dt);
  if(q.m.position.y<-1.64){q.m.position.y=-1.64+Math.min(.3,spill.length*.0015)*Math.random();if(Math.abs(q.v.y)>1.5){q.v.y*=-.35;q.v.x*=.7;q.v.z*=.7;q.w.multiplyScalar(.6)}else q.rest=true}}else q.m.quaternion.slerp(q.restQ,Math.min(1,dt*8))}
 let tz=baseZ(),ty=.5;if(G.cur){const f=G.cur,top=f.mesh.position.y+f.Lg*f.mesh.scale.y-1.7;tz=Math.max(tz,(top+1.7)/2/.364*1.5);ty=Math.max(.5,(top-1.7)/2)}
 camZ+=(tz-camZ)*Math.min(1,dt*4);camY+=(ty-camY)*Math.min(1,dt*4);cam.position.set(0,camY+.7,camZ);cam.lookAt(0,camY,0);
 if(G.pulse)grp.scale.setScalar(1+.03*Math.sin(T*16));
 R.render(sc,cam);drawFx();drawCrack();drawTouch()}
requestAnimationFrame(loop);
$('ov').innerHTML='<div class=card><h1>🍟 ポテトバトル</h1><p>2人で交互に、ポテトを3本ずつ引き抜こう！<br>📱 スマホは交代で渡してね<br>👆 上にスワイプで引き抜き<br>↔ 左右スワイプで箱をゆらして、好きなポテトを探そう<br>💪 長いほど、なかなか抜けない<br>📏 3本の長さの合計が長いほうの勝ち<br>🎰 長さは引き抜くまで分からない<br>⚠️ 超ロングも、ちびポテトもいるぞ！</p><button id=go>スタート！</button><br><button id=pm style="background:#444;font-size:15px;padding:8px 18px">🎬 プロモーション(確率固定)</button></div>';$('ov').className='on';$('go').onclick=()=>{beep(660,.1);newGame()};$('pm').onclick=()=>{beep(660,.1);startFixed()};if(location.hash=='#promo')setTimeout(startFixed,300);
</script></body></html>
