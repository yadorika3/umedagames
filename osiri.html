// ---- Autopilot (demo mode) ----
function autopilotDecide() {
  let bestGoodLane = -1, bestGoodDepth = -1;
  let dangerInMyLane = false;
  let safeLanes = [0,1,2];

  for (const o of orbs) {
    if (o.depth < 0.35) continue;
    if (o.colorDef.bad) {
      if (o.lane === babyLane && o.depth > 0.55) dangerInMyLane = true;
      if (o.depth > 0.75) {
        const idx = safeLanes.indexOf(o.lane);
        if (idx > -1) safeLanes.splice(idx,1);
      }
    } else {
      if (o.depth > bestGoodDepth) {
        bestGoodDepth = o.depth;
        bestGoodLane = o.lane;
      }
    }
  }

  if (dangerInMyLane) {
    const candidates = safeLanes.length ? safeLanes : [0,1,2].filter(l => l !== babyLane);
    let target = candidates.reduce((a,b) => Math.abs(a-babyLane) < Math.abs(b-babyLane) ? a : b, candidates[0]);
    babyLane = target;
    return;
  }

  if (bestGoodLane !== -1 && bestGoodLane !== babyLane) {
    babyLane = bestGoodLane;
    return;
  }

  if (Math.random() < 0.15) {
    babyLane = 1;
  }
}

let lastTime = 0;
function loop(t) {
  const dt = Math.min(t - lastTime, 50) || 16;
  lastTime = t;

  if (bannerTimer > 0) bannerTimer -= dt;
  if (screenShake > 0) screenShake *= 0.85;
  psyHue = (elapsed*0.08) % 360;

  if (bossActive) {
    const lc = (elapsed % 3200)/3200;
    if (lc < 0.02 && lc*3200 < dt+2) screenShake = Math.max(screenShake, 14);
  }

  const paused = bannerTimer > 700;

  if (running && !paused) {
    elapsed += dt;
    spawnTimer += dt;

    if (autoMode) {
      autoDecisionTimer += dt;
      if (autoDecisionTimer > 90) {
        autoDecisionTimer = 0;
        autopilotDecide();
      }
    }

    if (spawnInterval > 550) spawnInterval -= dt*0.02;
    baseSpeed = (3.4 + elapsed/20000) * (hipBoostActive ? 2.6 : 1);
    const effectiveInterval = bossActive ? spawnInterval*0.65 : spawnInterval;
    if (spawnTimer > effectiveInterval) {
      spawnTimer = 0;
      spawnOrb();
    }

    if (!bossActive) {
      hipItemSpawnTimer += dt;
      if (hipItemSpawnTimer > hipItemSpawnInterval) {
        hipItemSpawnTimer = 0;
        hipItemSpawnInterval = 10000 + Math.random()*5000;
        spawnHipItem();
      }
    }

    if (hipBoostActive) {
      hipBoostTimer -= dt;
      if (hipBoostTimer <= 0) {
        hipBoostActive = false;
      } else {
        // rhythmic camera pulse synced to the exaggerated wiggle, plus a shower of pink hearts
        hipCamPulseTimer += dt;
        if (hipCamPulseTimer > 420) {
          hipCamPulseTimer = 0;
          zoomPunch = Math.max(zoomPunch, 0.07);
        }
        hipHeartTimer += dt;
        if (hipHeartTimer > 160) {
          hipHeartTimer = 0;
          const hx = laneToX(babyLaneVisual, CATCH_DEPTH);
          const hy = BABY_GROUND_Y - 30;
          for (let i=0;i<3;i++) {
            particles.push({
              x: hx + (Math.random()-0.5)*40, y: hy + (Math.random()-0.5)*20,
              vx: (Math.random()-0.5)*2, vy: -1.5 - Math.random()*1.5,
              spiral: (Math.random()-0.5)*0.2,
              life: 1, maxLife: 1,
              size: 6 + Math.random()*4,
              shape: 'diamond',
              color: hsl(320 + Math.random()*30, 100, 72, 1)
            });
          }
        }
      }
    }
    const hipTarget = hipBoostActive ? 1.85 : 1;
    hipScaleBoost += (hipTarget - hipScaleBoost) * 0.08;
    const wiggleTarget = hipBoostActive ? 2.2 : 1;
    hipWiggleBoost += (wiggleTarget - hipWiggleBoost) * 0.08;

    scrollOffset += (baseSpeed/280)*dt/16;

    for (let i=orbs.length-1;i>=0;i--) {
      const o = orbs[i];
      o.depth += (baseSpeed/900)*dt/16 * (0.4 + o.depth*1.6);
      if (o.depth >= CATCH_DEPTH) {
        if (o.lane === babyLane) {
          if (o.isHipItem) {
            hipBoostActive = true;
            hipBoostTimer = HIP_BOOST_DURATION;
            catchStreak = Math.max(catchStreak, 8);
            lastCatchElapsed = elapsed;
            spawnParticles(o._screenX, o._screenY, '#ff5fb0', 'catch');
            score += 30;
            updateHUD();
          } else if (o.colorDef.bad) {
            if (hipBoostActive) {
              // invincible while boosted: plow straight through hazards for a bonus instead of taking damage
              catchStreak++;
              lastCatchElapsed = elapsed;
              spawnParticles(o._screenX, o._screenY, o.colorDef.fill, 'catch');
              score += 20;
              updateHUD();
            } else {
              catchStreak = 0;
              spawnParticles(o._screenX, o._screenY, o.colorDef.fill, 'hit');
              loseLife();
            }
          } else {
            catchStreak++;
            lastCatchElapsed = elapsed;
            spawnParticles(o._screenX, o._screenY, o.colorDef.fill, 'catch');
            if (bossActive) {
              bossHP--;
              score += 15;
              if (bossHP <= 0) defeatBoss();
            } else {
              score += 10;
              stageScore += 10;
              if (stageScore >= STAGE_BOSS_THRESHOLD) triggerBoss();
            }
            updateHUD();
          }
        }
        orbs.splice(i,1);
      }
    }
    if (elapsed - lastCatchElapsed > 2200 && catchStreak > 0) catchStreak = 0;
    updateParticles(dt);
    updateComboPopups(dt);
  } else if (running && paused) {
    updateParticles(dt);
    updateComboPopups(dt);
  }

  // ---- draw ----
  ctx.save();
  if (screenShake > 0.3) {
    ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
  }
  if (zoomPunch > 0.002) {
    ctx.translate(W/2, H/2);
    ctx.scale(1+zoomPunch, 1+zoomPunch);
    ctx.translate(-W/2, -H/2);
  }
  drawSky();
  drawGroundGlow();
  drawDecor(decorL, 'L');
  drawDecor(decorR, 'R');
  drawRoad();
  drawBoss();
  const sortedOrbs = [...orbs].sort((a,b)=>a.depth-b.depth);
  for (const o of sortedOrbs) drawOrb(o);
  drawBaby();
  drawParticles();
  drawSparkleRays();
  drawComboPopups();
  drawScreenFlash();

  // full-screen chromatic pulse overlay for extra trip intensity
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  const pulseGrad = ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,W*0.8);
  pulseGrad.addColorStop(0, hsl(psyHue,100,60,0.12));
  pulseGrad.addColorStop(0.5, hsl(psyHue+120,100,55,0.08));
  pulseGrad.addColorStop(1, hsl(psyHue+240,100,50,0.14));
  ctx.fillStyle = pulseGrad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();

  drawBanner();
  drawHipBoostHUD();
  ctx.restore();

  requestAnimationFrame(loop);
}

// ---- play recording: a small self-contained GIF89a encoder that runs entirely on
// the main thread (no Web Workers, no MediaRecorder/captureStream — none of those
// are available in this sandboxed embedded context, so this avoids them completely) ----
const recBtn = document.getElementById('recBtn');
const recIndicator = document.getElementById('recIndicator');
const downloadLink = document.getElementById('downloadLink');
const recStatus = document.getElementById('recStatus');

function showRecStatus(msg, autoHideMs) {
  console.log('[rec]', msg);
  recStatus.textContent = msg;
  recStatus.classList.remove('hidden');
  if (autoHideMs) {
    clearTimeout(showRecStatus._t);
    showRecStatus._t = setTimeout(() => recStatus.classList.add('hidden'), autoHideMs);
  }
}

function recordingSupported() { return true; }

// downscaled capture resolution keeps file size and main-thread encode time reasonable
const REC_W = 240, REC_H = 360;
const recSmallCanvas = document.createElement('canvas');
recSmallCanvas.width = REC_W; recSmallCanvas.height = REC_H;
const recSmallCtx = recSmallCanvas.getContext('2d');

function captureCompositeFrame() {
  recordCtx.clearRect(0, 0, W, H);
  recordCtx.drawImage(canvas, 0, 0, W, H);
  if (babyCanvasEl) recordCtx.drawImage(babyCanvasEl, 0, 0, W, H);
  recSmallCtx.clearRect(0, 0, REC_W, REC_H);
  recSmallCtx.drawImage(recordCanvas, 0, 0, REC_W, REC_H);
  return recSmallCtx.getImageData(0, 0, REC_W, REC_H);
}

// ---- fixed 256-colour palette (8 levels R x 8 levels G x 4 levels B) so every
// pixel can be quantised with simple bit-shifts — no per-frame palette analysis needed
function quantizeToIndices(imageData) {
  const src = imageData.data;
  const n = imageData.width * imageData.height;
  const out = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = src[p] >> 5;       // 0-7
    const g = src[p+1] >> 5;     // 0-7
    const b = src[p+2] >> 6;     // 0-3
    out[i] = (r << 5) | (g << 2) | b;
  }
  return out;
}
function buildFixedPalette() {
  const pal = new Uint8Array(256 * 3);
  for (let r = 0; r < 8; r++) {
    for (let g = 0; g < 8; g++) {
      for (let b = 0; b < 4; b++) {
        const idx = (r << 5) | (g << 2) | b;
        pal[idx*3]   = Math.round(r * 255 / 7);
        pal[idx*3+1] = Math.round(g * 255 / 7);
        pal[idx*3+2] = Math.round(b * 255 / 3);
      }
    }
  }
  return pal;
}
const FIXED_PALETTE = buildFixedPalette();

// ---- minimal GIF89a LZW encoder (constant-width "literal" codes only — i.e. no
// dictionary growth — which trades a little file size for a vastly simpler and more
// robust encoder that has no code-size-growth edge cases to get wrong) ----
function gifLZWEncodeLiteral(indices, minCodeSize) {
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  const codeSize = minCodeSize + 1; // stays constant the whole time
  const bytes = [];
  let bitBuf = 0, bitCnt = 0;
  function emit(code) {
    bitBuf |= (code << bitCnt);
    bitCnt += codeSize;
    while (bitCnt >= 8) {
      bytes.push(bitBuf & 0xFF);
      bitBuf >>= 8;
      bitCnt -= 8;
    }
  }
  emit(clearCode);
  for (let i = 0; i < indices.length; i++) emit(indices[i]);
  emit(eoiCode);
  if (bitCnt > 0) bytes.push(bitBuf & 0xFF);
  return bytes;
}

function writeSubBlocks(bytes, out) {
  let i = 0;
  while (i < bytes.length) {
    const chunk = bytes.slice(i, i + 255);
    out.push(chunk.length, ...chunk);
    i += 255;
  }
  out.push(0);
}

class SimpleGifEncoder {
  constructor(width, height) {
    this.w = width; this.h = height;
    this.out = [];
    this._header();
  }
  _u16(out, v) { out.push(v & 0xFF, (v >> 8) & 0xFF); }
  _header() {
    const out = this.out;
    out.push(0x47,0x49,0x46,0x38,0x39,0x61); // "GIF89a"
    this._u16(out, this.w);
    this._u16(out, this.h);
    out.push(0xF7, 0, 0); // global color table, 256 entries, bg=0
    for (let i = 0; i < 256; i++) out.push(FIXED_PALETTE[i*3], FIXED_PALETTE[i*3+1], FIXED_PALETTE[i*3+2]);
    // NETSCAPE2.0 application extension -> infinite loop
    out.push(0x21, 0xFF, 0x0B,
      0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,
      0x03, 0x01, 0x00, 0x00, 0x00);
  }
  addFrame(indices, delayCs) {
    const out = this.out;
    out.push(0x21, 0xF9, 0x04, 0x04);
    this._u16(out, delayCs);
    out.push(0x00, 0x00);
    out.push(0x2C);
    this._u16(out, 0); this._u16(out, 0);
    this._u16(out, this.w); this._u16(out, this.h);
    out.push(0x00);
    const minCodeSize = 8;
    out.push(minCodeSize);
    const lzwBytes = gifLZWEncodeLiteral(indices, minCodeSize);
    writeSubBlocks(lzwBytes, out);
  }
  finish() {
    this.out.push(0x3B);
    return new Blob([new Uint8Array(this.out)], { type: 'image/gif' });
  }
}

let recFrames = [];
let gifFrameTimer = null;
const GIF_FRAME_DELAY = 150;   // ms between captured frames
const GIF_MAX_FRAMES = 70;     // keeps encode time + file size manageable (~10.5s clip)

function startRecording() {
  if (isRecording) return;
  downloadLink.classList.add('hidden');
  recStatus.classList.add('hidden');
  recFrames = [];

  isRecording = true;
  recBtn.textContent = '⏹ STOP';
  recBtn.classList.add('recording');
  recIndicator.classList.remove('hidden');
  showRecStatus('録画中...', 1200);

  gifFrameTimer = setInterval(() => {
    const imgData = captureCompositeFrame();
    recFrames.push(quantizeToIndices(imgData));
    if (recFrames.length >= GIF_MAX_FRAMES) stopRecording();
  }, GIF_FRAME_DELAY);
}

function resetRecordUI() {
  recBtn.textContent = '⏺ REC';
  recBtn.disabled = false;
  recBtn.classList.remove('recording');
  recIndicator.classList.add('hidden');
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  if (gifFrameTimer) { clearInterval(gifFrameTimer); gifFrameTimer = null; }

  recBtn.textContent = '⏳ 処理中...';
  recBtn.disabled = true;
  recIndicator.classList.add('hidden');

  if (recFrames.length === 0) {
    resetRecordUI();
    showRecStatus('❌ 録画データが空でした。もう一度お試しください。');
    return;
  }

  showRecStatus('GIFを書き出し中... (' + recFrames.length + 'フレーム)');

  // encode on the next tick so the "処理中" state actually paints first
  setTimeout(() => {
    try {
      const enc = new SimpleGifEncoder(REC_W, REC_H);
      const delayCs = Math.round(GIF_FRAME_DELAY / 10);
      for (let i = 0; i < recFrames.length; i++) {
        enc.addFrame(recFrames[i], delayCs);
      }
      const blob = enc.finish();
      console.log('[rec] finished, blob size:', blob.size);
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      downloadLink.download = 'baby-run-play.gif';
      downloadLink.classList.remove('hidden');
      resetRecordUI();
      showRecStatus('✅ 完成!(' + Math.round(blob.size/1024) + 'KB) 右上の⬇から保存', 6000);
      try { downloadLink.click(); } catch (e) { console.log('[rec] auto-click failed', e); }
    } catch (e) {
      console.log('[rec] encode error:', e);
      resetRecordUI();
      showRecStatus('❌ 書き出し中にエラー: ' + (e.message || e));
    } finally {
      recFrames = [];
    }
  }, 30);
}

recBtn.addEventListener('click', () => {
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

if (!recordingSupported()) {
  recBtn.style.opacity = '0.4';
  recBtn.title = 'この端末では録画に対応していません';
}

requestAnimationFrame(loop);
</script>
</body>
</html>
