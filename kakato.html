<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Sleep</title>
<style>
:root{--bg:#1a1c2c;--fg:#f4f4f4;--ac:#ffcd75;--bt:#b13e53;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c2c;--fg:#f4f4f4}}
:root[data-theme="dark"]{--bg:#1a1c2c;--fg:#f4f4f4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#tr{pointer-events:none}
.mv{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(26px,9vw,46px);font-weight:900;font-style:italic;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000;pointer-events:none;opacity:0}
.mv.on{animation:mvp 1.5s ease-out}
@keyframes mvp{0%{opacity:0;transform:scale(2.2) rotate(-6deg)}12%{opacity:1;transform:scale(1) rotate(-4deg)}80%{opacity:1;transform:scale(1) rotate(-4deg)}100%{opacity:0;transform:scale(1.05) rotate(-4deg) translateY(-24px)}}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#sq{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(62vw,280px);height:18px;border:2px solid #ffffffaa;border-radius:10px;background:#00000066;overflow:hidden;pointer-events:none}
#sqf{height:100%;width:50%}
#sq span{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:bold;line-height:14px;text-shadow:1px 1px 0 #000}
#ck{position:fixed;left:50%;top:68%;width:min(46vw,190px);transform:translate(-50%,-50%);opacity:0;pointer-events:none;text-align:center}
#ck.on{animation:ckk 1.4s ease-in-out}
@keyframes ckk{0%{opacity:0;transform:translate(-50%,-46%) scale(.85)}22%{opacity:.95;transform:translate(-50%,-50%) scale(1)}70%{opacity:.95}100%{opacity:0;transform:translate(-50%,-56%) scale(1.06)}}
#ct{font-size:16px;font-weight:bold;margin-top:4px;text-shadow:1px 1px 0 #000}
#vs{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 20px #5ab8ff;opacity:0;transition:opacity .4s}
#vg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 24px #ff3b3b;opacity:0;transition:opacity .2s}
#fl.on{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
#sc{transform-origin:left center;display:inline-block}
.sb{position:fixed;transform:translate(-50%,-100%);padding:3px 9px;border-radius:12px;font-size:clamp(11px,3.6vw,15px);font-weight:bold;color:#1a1c2c;background:#fff;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 38px);left:10px;right:10px;height:4px;background:#ffffff26;pointer-events:none}
#tf{display:block;height:100%;width:0;background:linear-gradient(90deg,#41a6f6,#ffcd75)}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:10px;right:10px;display:flex;justify-content:space-between;font-size:clamp(14px,4.5vw,22px);font-weight:bold;text-shadow:2px 2px 0 #000;pointer-events:none}
#msg{position:fixed;left:0;right:0;top:24%;text-align:center;font-size:clamp(16px,5.5vw,28px);font-weight:bold;color:var(--ac);text-shadow:2px 2px 0 #000;pointer-events:none}
#st{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:130px;height:130px;border-radius:50%;border:3px solid #ffffff88;background:#ffffff18;display:flex;align-items:center;justify-content:center}
#kn{width:56px;height:56px;border-radius:50%;background:#ffffffaa}
#tip{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:150px;font-size:12px;line-height:1.5;text-shadow:1px 1px 0 #000;pointer-events:none;text-align:right;opacity:.85}
#ov{overflow-y:auto;position:fixed;inset:0;background:#1a1c2ceb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;font-size:clamp(13px,4vw,17px);line-height:1.7}
#gt{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 46px);width:min(30vw,130px);height:auto;pointer-events:none;opacity:.92}
.cf{position:absolute;top:-14px;width:9px;height:14px;opacity:.9;animation:cfa 3s linear infinite;pointer-events:none}
@keyframes cfa{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(112vh) rotate(720deg)}}
.r0{font-size:clamp(16px,5vw,22px);font-weight:900;letter-spacing:1px;animation:rwi .6s both}
.stars{font-size:clamp(30px,10vw,44px);color:#ffd23f;text-shadow:0 0 14px #ffd23f;animation:rwi .6s .2s both}
.stars u{text-decoration:none;color:#ffffff33;text-shadow:none}
.rl{font-size:clamp(70px,24vw,110px);font-weight:900;line-height:1;animation:rpop .8s .5s cubic-bezier(.2,1.6,.4,1) both}
.rt{font-size:clamp(38px,13vw,60px);font-weight:900;color:#fff;text-shadow:3px 3px 0 #b13e53}
.rp{font-size:14px;letter-spacing:3px;color:#cfe8ff}
.rp em{color:#ffd23f;font-style:normal;display:inline-block;animation:pls .5s infinite alternate}
.rw{display:flex;justify-content:space-between;width:min(80vw,320px);padding:3px 10px;border-bottom:1px solid #ffffff33;animation:rwi .5s both}
.rw b{color:#ffd23f}
@keyframes rwi{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes rpop{0%{opacity:0;transform:scale(3) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pls{to{transform:scale(1.2)}}
#ttl{width:min(86vw,420px);height:auto;margin-bottom:4px}
#ov h1{margin:0;font-size:clamp(24px,9vw,40px);color:var(--ac);text-shadow:3px 3px 0 var(--bt)}
button{font:inherit;border:3px solid #fff;background:#333c57;color:#fff;padding:10px 24px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="tr"></canvas>
<div id="hud"><span id="sc">0</span><span id="cb"></span><span id="tm">22:00</span></div><div id="tb"><i id="tf"></i></div><div class="sb" id="b0"></div><div class="sb" id="b1"></div><div class="mv" id="mv"></div><div id="fl"></div><div id="vg"></div><div id="vs"></div><img id="gt" alt=""><div id="ck"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1a1c2ccc" stroke="#fff" stroke-width="3"/><g id="tks"></g><line id="hh" x1="50" y1="50" x2="50" y2="27" stroke="#fff" stroke-width="4" stroke-linecap="round"/><line id="mh" x1="50" y1="50" x2="50" y2="14" stroke="#cfe8ff" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#fff"/></svg><div id="ct"></div></div><div id="sq"><div id="sqf"></div><span>SLEEP QUALITY</span></div>
<div id="msg"></div>
<div id="st" style="display:none"><div id="kn"></div></div>
