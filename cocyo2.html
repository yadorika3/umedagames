<html lang="ja"><head><meta charset="utf-8">

<title>コチョコチョ・パンチアウト 3D</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#05060c;--fg:#f4f4f8;--ac:#ffcf3f;--pk:#ff5fa2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060c}}
:root[data-theme="dark"]{--bg:#05060c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"DotGothic16","Hiragino Sans",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px;pointer-events:none}
#top{display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 6px #000}
#hearts{color:#ff4d5a;font-size:20px;letter-spacing:2px}
.bar{position:relative;height:20px;margin-top:4px;border:3px solid #fff;border-radius:0;background:#b8001c;overflow:hidden;box-shadow:3px 3px 0 #000}#hp{height:100%;width:100%;background:#ffe000 !important;transition:none}
#fill{height:100%;width:100%;margin-left:auto;background:#ffe000;transition:none}
.lab{font-size:11px;opacity:.8;text-shadow:0 1px 4px #000}.row{display:flex;gap:12px}.row>div{flex:1}.row{align-items:flex-end}.r{display:flex;align-items:center;gap:6px;height:14px}.r .bar{flex:1;margin-top:0}#nm{font-size:12px;font-weight:800;line-height:1;white-space:nowrap;text-shadow:0 1px 4px #000}.lab.me{font-weight:400;font-size:14px;opacity:1;color:#fff;text-shadow:2px 2px 0 #000}
#msg{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:30px;font-weight:900;color:var(--ac);text-shadow:0 3px 10px #000;pointer-events:none}
.pt{position:fixed;border-radius:50%;border:3px solid #ffe27a;transform:translate(-50%,-50%);pointer-events:none;display:none;background:rgba(255,95,162,calc(.2 + var(--p,0)*.7));box-shadow:0 0 18px 6px #ff5fa2aa;animation:pl .5s infinite alternate;color:#fff;font-size:12px;font-weight:900;text-align:center;line-height:1}
.pt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
@keyframes pl{to{box-shadow:0 0 30px 12px #ffe27acc;border-color:#fff}}
#fg{position:fixed;height:160px;pointer-events:none;display:none;transform:translate(-42%,-4%);image-rendering:pixelated;z-index:6;filter:contrast(1.2) saturate(1.3) drop-shadow(3px 4px 0 #000a)}
.fx{position:fixed;font-weight:900;color:#fff;text-shadow:0 0 6px #ff5fa2;pointer-events:none;animation:up .7s forwards;transform:translate(-50%,-50%)}
@keyframes up{to{margin-top:-60px;opacity:0}}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#ff0000aa 0%,#c0000088 35%,#800000cc 70%,#000c 100%);opacity:0;pointer-events:none;transition:opacity .45s;z-index:8}.shk{animation:sk .55s}@keyframes sk{10%{transform:translate(-18px,8px) rotate(-2deg)}25%{transform:translate(22px,-10px) rotate(3deg)}40%{transform:translate(-16px,6px) rotate(-2deg)}55%{transform:translate(14px,-8px) rotate(2deg)}70%{transform:translate(-10px,4px)}85%{transform:translate(8px,-3px)}}.big{position:fixed;left:50%;top:42%;font-size:56px;font-weight:900;white-space:nowrap;pointer-events:none;translate:-50% -50%;animation:bg .65s forwards;text-shadow:0 0 12px #000,0 3px 0 #000}@keyframes bg{0%{scale:.3;opacity:1}40%{scale:1.25}100%{scale:1.5;opacity:0}}.sp{position:fixed;font-size:26px;pointer-events:none;animation:spk .65s forwards}@keyframes spk{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}.cut{position:fixed;left:0;right:0;top:32%;height:140px;pointer-events:none;overflow:hidden;z-index:4;animation:cf 1.8s forwards}.cut::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#fff1 22px 24px)}.cut i{position:absolute;inset:0 -20px;background:linear-gradient(100deg,#000e 30%,var(--c) 30.5%,var(--c) 33%,#000e 33.5%,#000e 66%,var(--c) 66.5%,var(--c) 68%,#000e 68.5%);transform:skewX(-14deg) translateX(-115%);animation:ci .35s cubic-bezier(.2,.9,.2,1) forwards}.cut b{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:58px;font-weight:900;font-style:italic;color:#fff;letter-spacing:2px;white-space:nowrap;text-shadow:0 0 16px var(--c),4px 4px 0 #000;transform:translateX(120%);animation:ct .4s .1s cubic-bezier(.2,.9,.2,1) forwards}.cut small{font-size:15px;letter-spacing:4px;color:var(--c);font-style:normal;text-shadow:0 2px 4px #000}@keyframes ci{to{transform:skewX(-14deg) translateX(0)}}@keyframes ct{to{transform:translateX(0)}}@keyframes cf{0%,82%{opacity:1}100%{opacity:0}}.cut.r{top:13%;height:104px}.cut.r b{flex-direction:row;gap:14px;font-size:38px}.cut.r b div{display:flex;flex-direction:column;align-items:flex-start}.face{width:80px;height:80px;border-radius:50%;border:3px solid var(--c);background:#111;background-size:360%;background-position:50% 22%;box-shadow:0 0 14px var(--c);flex:none}.cut.w,.cut.l{top:auto;bottom:11%;height:130px}.cut.w::after,.cut.l::after{display:none}.cut.w b{font-size:64px;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;transform:none;background:linear-gradient(#fff,#ffcf3f 60%,#e08a00);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 18px #ffcf3f)}.cut.l b{font-size:64px;color:#ff4d5a;transform:none;animation:drop .8s cubic-bezier(.6,0,1,.6) both}.cut.l i{background:#000c}@keyframes slam{0%{scale:3;opacity:0}100%{scale:1;opacity:1}}@keyframes drop{0%{translate:0 -320px;opacity:0}60%{translate:0 0;opacity:1}78%{translate:0 -16px}100%{translate:0 0}}.rays{position:fixed;left:50%;top:60%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(#ffcf3f40 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);pointer-events:none;z-index:3;animation:rot 6s linear infinite,cf 2s forwards}@keyframes rot{to{rotate:360deg}}#c{transition:filter .8s;image-rendering:pixelated;filter:contrast(1.2) saturate(1.35)}body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px),radial-gradient(circle,#0000 55%,#000a 130%)}body #ov h1{font-size:30px;font-weight:400;color:#ffe000;letter-spacing:2px;text-shadow:3px 3px 0 #c00,5px 5px 0 #000}body #ov button{border-radius:0;background:#e60012;border:3px solid #fff;box-shadow:4px 4px 0 #000;font-weight:400;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.4}}
#ov{position:fixed;inset:0;background:rgba(5,6,12,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0;font-size:28px;color:var(--ac)}
#ov p{margin:0;line-height:1.7;font-size:15px}
#ov button{font:inherit;font-weight:800;font-size:20px;padding:14px 36px;border:0;border-radius:30px;background:var(--pk);color:#fff}
#ov button:disabled{opacity:.4}
</style></head>

<div id="ov"><h1>コチョコチョ<br>パンチアウト 3D</h1>

<script>
const T=THREE,SPR=window.SPR,SPR2=window.SPR2,$=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.random()*a.length|0];

addEventListener('resize',rs);rs();
const halfW=()=>Math.tan(cam.fov*Math.PI/360)*cam.aspect*1.7;
// ring
const cv=document.createElement('canvas');cv.width=cv.height=512;const g=cv.getContext('2d');
g.fillStyle='#27418a';g.fillRect(0,0,512,512);g.strokeStyle='#fff';g.lineWidth=10;g.strokeRect(30,30,452,452);
g.fillStyle='#d6a000';g.beginPath();g.arc(256,256,120,0,7);g.fill();g.fillStyle='#27418a';g.beginPath();g.arc(256,256,100,0,7);g.fill();
for(let i=0;i<4000;i++){g.fillStyle=`rgba(255,255,255,${Math.random()*.04})`;g.fillRect(Math.random()*512,Math.random()*512,2,2)}
const ft=new T.CanvasTexture(cv);
const add=(m,x,y,z)=>{m.position.set(x,y,z);sc.add(m);return m};
add(new T.Mesh(new T.BoxGeometry(9.4,.3,9.4),new T.MeshStandardMaterial({map:ft,roughness:.8})),0,-.15,0);
add(new T.Mesh(new T.BoxGeometry(10.6,.5,10.6),new T.MeshStandardMaterial({color:0x6b1022})),0,-.45,0);
add(new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:0x07080f})),0,-.71,0).rotation.x=-Math.PI/2;
const cols=[0xd8202c,0xf2f2f2,0x2a46d8],H=4.5;
[.55,.95,1.35].forEach((y,i)=>{const mt=new T.MeshStandardMaterial({color:cols[i],roughness:.5});
 for(const s of[-1,1]){add(new T.Mesh(new T.CylinderGeometry(.035,.035,9,8),mt),s*H,y,0).rotation.x=Math.PI/2;
  add(new T.Mesh(new T.CylinderGeometry(.035,.035,9,8),mt),0,y,s*H).rotation.z=Math.PI/2}});
for(const x of[-H,H])for(const z of[-H,H]){add(new T.Mesh(new T.CylinderGeometry(.1,.1,1.6,12),new T.MeshStandardMaterial({color:0x888c99,metalness:.6,roughness:.3})),x,.8,z);
 add(new T.Mesh(new T.BoxGeometry(.28,1.1,.28),new T.MeshStandardMaterial({color:(x>0)==(z>0)?0xc2202c:0x2a46d8})),x,.75,z)}

const sp=new T.SpotLight(0xfff1d8,1.6,30,.9,.5);sp.position.set(0,8,2);sp.target.position.set(0,0,0);sc.add(sp,sp.target);
add(new T.PointLight(0xff4a8a,.7,14),-4,3,-4);add(new T.PointLight(0x4a7aff,.7,14),4,3,-4);
// crowd
{const n=900,pos=new Float32Array(n*3),col=new Float32Array(n*3),c=new T.Color();
 for(let i=0;i<n;i++){const a=R(-2.3,2.3),r=R(8,17);pos.set([Math.sin(a)*r,R(.4,2.5)+(r-8)*.45,-Math.cos(a)*r],i*3);c.setHSL(Math.random(),.5,R(.12,.35));col.set([c.r,c.g,c.b],i*3)}
 const gm=new T.BufferGeometry();gm.setAttribute('position',new T.BufferAttribute(pos,3));gm.setAttribute('color',new T.BufferAttribute(col,3));
 sc.add(new T.Points(gm,new T.PointsMaterial({size:.5,vertexColors:true})))}
// enemy
let loaded=0;const mk=A=>A.map(s=>{const t=new T.TextureLoader().load(s,()=>{if(++loaded===SPR.length*3){$('btn').disabled=false;$('btn').textContent='PUSH START'}});t.magFilter=t.minFilter=T.NearestFilter;t.generateMipmaps=false;return t});const TX=[mk(SPR),mk(window.SPR2),mk(window.SPR3)];let tex=TX[0];

fragmentShader:'uniform sampler2D map;uniform float hue,fl;varying vec2 v;void main(){vec4 c=texture2D(map,v);if(c.a<.03)discard;vec3 k=vec3(.57735);float a=cos(hue),s=sin(hue);c.rgb=c.rgb*a+cross(k,c.rgb)*s+k*dot(k,c.rgb)*(1.-a);c.rgb+=vec3(.5,.1,.3)*fl;c.rgb=floor(c.rgb*7.+.5)/7.;gl_FragColor=c;}'});

function startStage(){gauge=0;hp=100;mat.uniforms.hue.value=O[lv].hue;tex=TX[O[lv].set||0];PI=PITS[O[lv].set||0];hud();E.x=E.tx=0;E.z=E.tz=-.2;vul=false;setF(0);$('c').style.filter='';cut('ROUND '+(lv+1),'#ffffff',O[lv].n,1.7,'r');setPh('intro',1.8)}

function nextMove(){const xr=Math.max(.2,halfW()*.3),r=Math.random();E.tx=R(-xr,xr);E.tz=R(-.5,.1);E.ty=0;E.tsy=1;E.dk=r>.8}
function proj(u,v){const w=new T.Vector3((u-.5)*PW,(1-v)*PH,.02);em.localToWorld(w);const d=cam.position.distanceTo(w);w.project(cam);return{x:(w.x+1)/2*innerWidth,y:(1-w.y)/2*innerHeight,r:Math.max(18,Math.min(42,95/d))}}
function setPits(a){pits=a.map(([u,v])=>({u,v,x:0,y:0,r:30}));pg=[0,0];vul=true}
function burst(x,y,a,n){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='sp';s.textContent=P(a);s.style.left=x+'px';s.style.top=y+'px';const an=R(0,6.28),d=R(50,140);s.style.setProperty('--dx',Math.cos(an)*d+'px');s.style.setProperty('--dy',Math.sin(an)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),650)}}
function cut(t,c,s,d,k){const e=document.createElement('div');e.className='cut '+(k||'');e.style.setProperty('--c',c);e.style.animationDuration=d+'s';let h;if(k==='r')h='<i></i><b><span class="face" style="background-image:url('+[SPR,SPR2,window.SPR3][O[lv].set||0][0]+');filter:hue-rotate('+Math.round(O[lv].hue*57.3)+'deg)"></span><div>'+t+'<small>'+s+'</small></div></b>';else h=(k==='w'?'':'<i></i>')+'<b>'+t+'</b>';e.innerHTML=h;document.body.appendChild(e);csh=.3;beep(k==='l'?90:300,.25);if(k==='w'){const r=document.createElement('div');r.className='rays';r.style.animationDuration='6s,'+d+'s';document.body.appendChild(r);setTimeout(()=>r.remove(),d*1000);burst(innerWidth/2,innerHeight*.6,['🎉','✨','⭐','🏆'],26)}if(k==='l')$('c').style.filter='grayscale(1) brightness(.55)';setTimeout(()=>e.remove(),d*1000+100)}
function big(t,c){const b=document.createElement('div');b.className='big';b.textContent=t;b.style.color=c;document.body.appendChild(b);setTimeout(()=>b.remove(),650)}
function punchOut(){
  // パンチが出た瞬間のエフェクト（攻撃発生）
  csh=.35;hs=.05;beep(180,.08);setTimeout(()=>beep(120,.1),40);
  navigator.vibrate&&navigator.vibrate([30,20,50]);
  const f=$('flash');f.style.transition='none';
  f.style.background='radial-gradient(circle at 50% 45%,#fff8 0%,#ffcf3f66 25%,#0000 60%)';
  f.style.opacity=.85;setTimeout(()=>{f.style.transition='opacity .25s';f.style.opacity=0;
    setTimeout(()=>{f.style.background='radial-gradient(circle at 50% 40%,#ff0000aa 0%,#c0000088 35%,#800000cc 70%,#000c 100%)'},300);
  },50);
  burst(innerWidth/2,innerHeight*.42,['💨','💢','✦','⚡'],14);
  E.sh=.8;E.sy=1.08;
}
function hit(){hp-=28+lv*6;hud();csh=1.15;hs=.16;beep(70,.2);setTimeout(()=>beep(45,.28),50);setTimeout(()=>beep(35,.4),130);navigator.vibrate&&navigator.vibrate([140,30,200,40,120,30,90]);const f=$('flash');f.style.transition='none';f.style.background='radial-gradient(circle at 50% 40%,#ff0000ee 0%,#c00000aa 30%,#600000dd 65%,#000e 100%)';f.style.opacity=1;setTimeout(()=>{f.style.transition='opacity .75s';f.style.opacity=0},100);const c=$('c');c.classList.remove('shk');void c.offsetWidth;c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),600);burst(innerWidth/2,innerHeight*.48,['💥','💢','⭐','🔥','💫','💢','💥'],32);burst(innerWidth*.32,innerHeight*.4,['💢','💥','⚡'],12);burst(innerWidth*.68,innerHeight*.4,['💢','💥','⚡'],12);E.tz=.22;E.sh=1.4}
function tick(dt,t){if(hs>0){hs-=dt;return}
 const o=O[lv];pt+=dt;E.lt-=dt;E.sh=Math.max(0,E.sh-dt*3);csh=Math.max(0,csh-dt*2.8);
 if(ph==='intro'&&pt>pd){say('');setPh('move',R(...o.gap));E.mt=0}
 else if(ph==='move'){E.mt-=dt;if(E.mt<=0){nextMove();E.mt=R(.5,1)}{const dx=E.tx-E.x,dz=E.tz-E.z,cd=Math.abs(dz)>.2&&Math.abs(dz)>Math.abs(dx)?(dz>0?3:4):Math.abs(dx)>.12?(dx>0?1:2):0;setF(E.dk?16:cd&&Math.sin(t*9)>0?cd:0)}
  if(pt>pd){side=Math.random()<.5?'L':'R';const ts=Math.random()<o.feint?(side==='L'?'R':'L'):side;setF(ts==='L'?7:8);E.tz=.15;E.tx*=.4;E.ty=0;E.tsy=1;const pf=ts==='L'?5:6;setPits(PI[pf]);setPh('tell',o.tell)}}
 else if(ph==='tell'){
  if(pg[0]>=o.need){ // 予備動作中にくすぐり切ったらパンチキャンセル
    gauge+=8;hud();beep(900,.15);burst(innerWidth/2,innerHeight*.45,['✨','💕','⭐','😆','😂'],16);hs=.1;csh=.25;
    stunSide=Math.random()<.5?'L':'R';setPits(PI[14]);E.tz=0;E.tx=0;setPh('stun',1.9);
  }else if(pt>pd){const pf=side==='L'?5:6;setF(pf);E.tz=.22;E.tx=0;vul=false;pits=[];punchOut();hit();setPh('punch',.32)}
 }
 else if(ph==='punch'){if(pt>pd){setF(0);setPh('hurt',.45)}}
 else if(ph==='hurt'&&pt>pd){say('');if(hp<=0){setPh('lose',1.8);setF(0);cut('YOU LOSE','#ff4d5a','',1.7,'l')}else{setF(0);E.tz=-.15;vul=false;pits=[];setPh('vic',1.4)}}
 else if(ph==='stun'){const w=stunSide==='L'?[9,10]:[11,12],f=E.lt>0?(Math.sin(t*30)>0?w[0]:w[1]):14;setF(f);pits=PI[f].map(([u,v])=>({u,v,x:0,y:0,r:30}));if(pt>pd){vul=false;say('');setPh('move',R(...o.gap));E.mt=0}}
 else if(ph==='vic'&&pt>pd){vul=false;setPh('move',R(...o.gap));E.mt=0}
 else if(ph==='lose'&&pt>pd){ph='over';ov('GAME OVER','CONTINUE?','CONTINUE',startStage)}
 else if(ph==='won'&&pt>pd){say('');lv++;if(lv>=O.length){lv=0;ph='over';ov('全員笑わせた！','コチョコチョ・チャンピオン🏆','もう一度',startStage)}else startStage()}
 const k=Math.min(1,dt*(ph==='punch'||ph==='tell'?12:4));
 E.x+=(E.tx-E.x)*k;E.z+=(E.tz-E.z)*k;E.y+=(E.ty-E.y)*Math.min(1,dt*9);E.sy+=(E.tsy-E.sy)*Math.min(1,dt*10);
 const j=E.sh>0?(Math.random()-.5)*.12*E.sh:0,bob=0;
 mat.uniforms.fl.value=E.lt>0?.3+.2*Math.sin(t*40):0;em.position.set(Math.round((E.x+j)*14)/14,Math.round((E.y+bob)*14)/14,Math.round(E.z*14)/14);em.scale.set(ph==='punch'?1.06:1,E.sy*(ph==='punch'?1.06:1),1);em.rotation.z=-(E.tx-E.x)*.1+j;
 sh.position.set(E.x,.01,E.z);sh.scale.setScalar(1-E.y*.4);
 cam.position.set(Math.sin(t*.7)*.12+(Math.random()-.5)*csh,1.65+(Math.random()-.5)*csh,1.5);cam.lookAt(E.x*.3,1.55,0);
 for(let i=0;i<2;i++){const el=$('p'+i),p=pits[i];if(vul&&p&&!(ph==='punch'&&i>0)){const q=proj(p.u,p.v);p.x=q.x;p.y=q.y;p.r=q.r;
  el.style.cssText=`display:block;left:${q.x}px;top:${q.y}px;width:${q.r*2}px;height:${q.r*2}px;--p:${(ph==='punch'||ph==='tell')?Math.min(1,pg[0]/o.need):.5}`}else el.style.display='none'}
}
let down=false,lx=0,ly=0,fxT=0;
let hf=0,hi;addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;$('fg').src=window.HAND[0];clearInterval(hi);hi=setInterval(()=>{$('fg').src=window.HAND[hf=(hf+1)%8]},65);mv(e)});
addEventListener('pointerup',()=>{down=false;clearInterval(hi);$('fg').style.display='none'});addEventListener('pointercancel',()=>{down=false;clearInterval(hi);$('fg').style.display='none'});
addEventListener('pointermove',mv);
function mv(e){const x=e.clientX,y=e.clientY,d=Math.hypot(x-lx,y-ly);lx=x;ly=y;if(!down)return;
 const f=$('fg');f.style.display='block';f.style.left=x+'px';f.style.top=y+'px';f.style.transform=x<innerWidth/2?'':'translate(-58%,-4%) scaleX(-1)';
 if(!vul)return;const o=O[lv];
 pits.forEach((p,i)=>{if(Math.hypot(x-p.x,y-p.y)<p.r*2.8){pg[i]+=d*1.7;E.lt=.25;E.sh=1;
  if(ph!=='won'){const m=ph==='punch'?0.85:ph==='tell'?0.55:ph==='stun'?0.22:0.06;gauge+=d*o.rate*m}
  if(performance.now()-fxT>220){fxT=performance.now();const s=document.createElement('div');s.className='fx';s.textContent='';s.style.left=x+R(-30,30)+'px';s.style.top=y-30+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700);navigator.vibrate&&navigator.vibrate(15);E.sy=.93}}});
 hud();if(gauge>=100&&ph!=='won'&&ph!=='over'){vul=false;setF(15);beep(1000,.3);cut('YOU WIN','#ffcf3f','',2,'w');E.tz=-.3;setPh('won',2.2)}}
let last=performance.now();
ren.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(ph!=='title')tick(dt,now/1000);else{cam.position.set(0,1.65,1.5);cam.lookAt(0,1.55,0)}ren.render(sc,cam)});
hud();
</script></body></html>
