{

}

    const d=TAB[i].phi-TAB[i-1].phi,a=TAB[i].a,sg=Math.abs(d)<1e-5?0:Math.sign(d);

const _r={px:0,pz:0,phi:0,py:0,sl:0,wf:1};let _pitch=0;

}

}
const hOf=(h,p)=>typeof h==='function'?h(p):p.py+h;

    pos.push(p.px-x*Math.cos(p.phi),hOf(k?h1:h0,p),p.pz-x*Math.sin(p.phi));uv.push(x/TILE,p.a/TILE);nor.push(0,1,0);if(role){const c_=stageCol(p.a,role);col.push(c_.r,c_.g,c_.b)}

const SL=120,BL=24,mkc=h=>new THREE.Color(h);
const STG=[
 {n:'まち',p:0,sky:0x8fd0ff,fog:0xcfeaff,g:0x5fae45,w:0xcfc7b4,r:0x585d6a},
 {n:'もり',p:8,sky:0x6fbf8f,fog:0xbfe6c8,g:0x2f7d3a,w:0x7a5a3a,r:0x6b5a45},
 {n:'かわ',p:2,sky:0x9fdcff,fog:0xdff4ff,g:0x4fb8e8,w:0x9ac06a,r:0x7a7f8a},
 {n:'うみ',p:1,sky:0x5ec8ff,fog:0xbdf0ff,g:0x2a8fe0,w:0xf1dca0,r:0x9a7a52},

  g.save();g.translate(x,y+82);g.fillStyle='#2b2b30';ci(0,0,26);g.fillStyle='#4a4a52';ci(0,0,19);g.fillStyle='#6b4a2a';g.fillRect(24,-5,40,10);g.restore();
}
function drawChev(x,y,d){
  g.strokeStyle='#ffe45c';g.lineWidth=10;g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<3;i++){const o=i*34*d;g.globalAlpha=.4+.2*i;g.beginPath();g.moveTo(x+o-14*d,y-30);g.lineTo(x+o+14*d,y);g.lineTo(x+o-14*d,y+30);g.stroke()}
  g.globalAlpha=1;
}
function drawFx(){
  if(S.fl&&S.fl.a>0){g.fillStyle='rgba('+S.fl.r+','+S.fl.g+','+S.fl.b+','+Math.min(.8,S.fl.a)+')';g.fillRect(0,0,W,H)}
  if(S.rg)for(const r of S.rg){const p=r.t;g.globalAlpha=(1-p)*.9;g.strokeStyle=r.c;g.lineWidth=r.w*(1-p)+1;g.beginPath();g.arc(r.x,r.y,8+p*r.m,0,7);g.stroke()}
  g.globalAlpha=1;
  if(S.fx)for(const f of S.fx){
    const p=f.t,a=1-p,sc=f.sc||1;
    g.globalAlpha=a;
    if(f.k==='rays'){
      g.strokeStyle=f.c||'#fff';g.lineCap='round';
      for(let i=0;i<28;i++){const ang=i/28*6.283+f.seed,r0=20+p*120,r1=r0+70+p*260*((i%3)+1)/3;g.lineWidth=4*(1-p)+1;g.beginPath();g.moveTo(f.x+Math.cos(ang)*r0,f.y+Math.sin(ang)*r0);g.lineTo(f.x+Math.cos(ang)*r1,f.y+Math.sin(ang)*r1);g.stroke()}
    }else if(f.k==='star'){
      drawStar(f.x,f.y,(30+p*150)*sc,'#ffe45c',p*2);drawStar(f.x,f.y,(18+p*90)*sc,'#ffffff',-p*3);
      for(let i=0;i<8;i++){const ang=i/8*6.283+f.seed,d=20+p*190*sc;drawStar(f.x+Math.cos(ang)*d,f.y+Math.sin(ang)*d,10*(1-p*.6),i%2?'#ff7ad9':'#9ff0ff',p*5)}
    }else{
      const n=f.k==='paste'?18:10,R=(f.k==='paste'?110:55)*sc;
      for(let i=0;i<n;i++){
        const ang=i/n*Math.PI*2+f.seed,d=8+p*R*(.7+.3*((i%3)/2)),sz=(f.k==='paste'?11:8)*sc*(1-p*.7);
        g.save();g.translate(f.x+Math.cos(ang)*d,f.y+Math.sin(ang)*d);g.rotate(ang+p*3);
        g.fillStyle=f.k==='paste'?(i%2?'#9ff0ff':'#ffffff'):(i%2?'#ffe45c':'#fff6b0');
        g.fillRect(-sz/2,-sz/2,sz,sz);g.restore();
      }
      if(f.k==='paste')drawStar(f.x,f.y,40+p*80,'#9ff0ff',p*2);else drawStar(f.x,f.y,(14+p*30)*sc,'#fff6b0',p*4);
    }
    g.globalAlpha=1;
  }
  if(S.cfly)for(const c of S.cfly){
    if(c.t<0)continue;const e=c.t*c.t*(3-2*c.t),tx_=28,ty_=77;
    drawCoinIcon(c.x+(tx_-c.x)*e,c.y+(ty_-c.y)*e-Math.sin(Math.PI*e)*90,10+4*Math.sin(Math.PI*e));
  }
  g.globalAlpha=1;
}
function speedLines(){
  const f=Math.max(0,Math.min(1.5,S.spf||1)),n=(S.cloud>0?44:22),cx=W/2,cy=H*.46;
  g.lineCap='round';
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+hash(i)*.3,ph=(S.time*(1.6+f)+hash(i+9))%1;
    const r0=150+ph*ph*330,len=14+ph*70*f,al=Math.min(1,ph*3)*(1-ph)*.55*Math.min(1,f);
    g.strokeStyle='rgba(255,255,255,'+al+')';g.lineWidth=2+ph*2;
    g.beginPath();g.moveTo(cx+Math.cos(ang)*r0,cy+Math.sin(ang)*r0*1.5);g.lineTo(cx+Math.cos(ang)*(r0+len),cy+Math.sin(ang)*(r0+len)*1.5);g.stroke();
  }
}
function hud(){
  g.clearRect(0,0,W,H);
  if(st==='opening'&&O){drawOpening();return}
  if(st==='play'&&!paused&&S.cloud>0)speedLines();
  const danger=1-(S.gap-1.4)/(26-1.4);
  drawMomIcon(30,32);
  bar(52,22,W/2-90,18,danger,'#ff4d6d');
  drawPasteGauge(W/2+34,16,W/2-52,28,S.paste/100);
  g.fillStyle='#142033cc';ci(W/2,32,19);g.fillStyle='#fff';g.fillRect(W/2-7,23,5,18);g.fillRect(W/2+2,23,5,18);
  tx(meters()+' m',W/2,92,32,'center');
  drawCoinIcon(30,80,11);tx(''+S.items,48,88,22,'left');
  {const p=(S.items%20)/20;g.save();g.fillStyle='#ffffff44';g.fillRect(20,100,90,8);g.fillStyle='#7af0ff';g.fillRect(20,100,90*p,8);g.restore();tx((S.items%20)+'/20',116,109,14,'left')}
  if(st==='play'&&S.mom.tw>0){g.fillStyle='rgba(255,60,60,.18)';g.fillRect(0,0,W,H);drawPanWarn(W/2,H*.3)}
  {const ka=(TR(S.D+26.5).phi-TR(S.D+23.5).phi)/3;if(st==='play'&&(S.sw||0)<.5&&Math.abs(ka)>.04&&Math.floor(S.time*5)%2===0)drawChev(W/2+(ka>0?-34:34),H*.4,ka>0?-1:1)}
  
  tx('最高 '+best+' m',W-16,86,20,'right','#ffe45c');
  if(st==='play'&&S.fp){g.fillStyle='#1c2030';g.fillRect(0,H/2-3,W,6)}
  
  
  
  pasteAlert();drawFx();
  if(st==='play'){
    const jx0=76,jy0=H-96,sv=(S.sw||0)>.5;
    g.globalAlpha=joy.on?.95:.6;g.fillStyle='#142033cc';g.beginPath();
    if(sv)g.roundRect(jx0-30,jy0-JR-16,60,2*JR+32,30);else g.roundRect(jx0-JR-16,jy0-30,2*JR+32,60,30);
    g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
    g.fillStyle='#fff';g.font='bold 18px '+FONT;g.textAlign='center';
    if(sv){g.beginPath();g.moveTo(jx0,jy0-JR-2);g.lineTo(jx0-9,jy0-JR+12);g.lineTo(jx0+9,jy0-JR+12);g.fill();g.beginPath();g.moveTo(jx0,jy0+JR+2);g.lineTo(jx0-9,jy0+JR-12);g.lineTo(jx0+9,jy0+JR-12);g.fill()}else{g.beginPath();g.moveTo(jx0-JR-2,jy0);g.lineTo(jx0-JR+12,jy0-9);g.lineTo(jx0-JR+12,jy0+9);g.fill();g.beginPath();g.moveTo(jx0+JR+2,jy0);g.lineTo(jx0+JR-12,jy0-9);g.lineTo(jx0+JR-12,jy0+9);g.fill()}
    const kx_=sv?jx0:jx0+(joy.on?joy.rx:0)*JR,ky_=sv?jy0+(joy.on?joy.ry:0)*JR:jy0;
    g.fillStyle='#ffffffee';ci(kx_,ky_,22);g.globalAlpha=1;
  }
  if(st==='play'){
    const air=S.jy>.05;g.globalAlpha=air?.5:.85;g.fillStyle='#142033';ci(W-56,H-84,40);
    g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(W-56,H-84,40,0,7);g.stroke();
    g.fillStyle='#fff';g.beginPath();g.moveTo(W-56,H-106);g.lineTo(W-76,H-80);g.lineTo(W-36,H-80);g.fill();g.fillRect(W-63,H-82,14,18);
    g.globalAlpha=1;
  }
  if(st==='caught'&&S.cap)drawCap(S.cap.t);
  if(paused){g.fillStyle='#0008';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.fillRect(W/2-34,H/2-40,24,80);g.fillRect(W/2+10,H/2-40,24,80)}
}
function frame(t){
  const dt=Math.min(.033,(t-last)/1000||0);last=t;
  if(st==='play'&&!paused){const k_=S.slow>0?.3:1;if(S.slow>0)S.slow-=dt;update(dt*k_)}else if(st==='caught')capUpdate(dt);else if(st==='opening'&&O)opUpdate(dt);
  sync();hud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- 開発者モード：ステージ/カメラ確認 ---------- */
function devTp(d){for(const o of S.obj)if(o.mesh)scene.remove(o.mesh);S.obj=[];S.foam=[];S.D=d;S.lr=d}
</script>
